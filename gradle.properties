# Project Falcon — DPS Android Client
# Gradle / Kotlin / Android build configuration.

# --- JVM ---
# Heap capped at 2 GB deliberately. The development machine has 7.8 GB total
# (see ADR-009) and must simultaneously host Android Studio (~3 GB) and, during
# runtime work, Ollama serving a 1.5B model (~1.5 GB). A larger Gradle daemon
# heap causes swapping, which is slower than the smaller heap it was meant to
# avoid. Raise this only on a machine with >= 16 GB.
#
# UTF-8 is pinned so prompt templates containing non-ASCII (Urdu / Roman Urdu
# test fixtures) compile identically on every machine.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# --- Build performance ---
# Parallel execution stays on, but workers are capped to leave cores for the IDE
# on a 4-core CPU (ADR-009).
org.gradle.parallel=true
org.gradle.workers.max=3
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ---
kotlin.code.style=official
